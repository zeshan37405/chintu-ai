plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zeshan.chintuai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zeshan.chintuai'
        minSdk 26
        targetSdk 36
        versionCode 25
        versionName '5.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError true
        checkDependencies true
        checkReleaseBuilds true
        warningsAsErrors false
        // GeminiLiveVoiceService checks RECORD_AUDIO before any AudioRecord session begins.
        disable 'MissingPermission'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
