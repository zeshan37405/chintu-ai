name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "fix/wazir-voice-turn-gate-4.0.1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

concurrency:
  group: wazir-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Report CI start
        if: github.ref == 'refs/heads/fix/wazir-voice-turn-gate-4.0.1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              body: `Wazir 4.0.1 CI started — run ${context.runId}, commit ${context.sha}.`
            })

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Reject embedded secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=build --exclude='*.md' '(AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z_-]{20,})' app; then
            echo "Potential API secret found in app sources"
            exit 1
          fi

      - name: Unit tests, lint and APK
        id: android_build
        run: gradle clean testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wazir-gen-z-4.0.1-echo-safe-voice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wazir-unit-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wazir-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Report CI result
        if: always() && github.ref == 'refs/heads/fix/wazir-voice-turn-gate-4.0.1'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.android_build.outcome }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 13,
              body: `Wazir 4.0.1 CI finished — run ${context.runId}; Android build outcome: **${outcome}**; commit ${context.sha}.`
            })
